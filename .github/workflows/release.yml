name: Build & Release Installer

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   • Manual run from GitHub Actions tab (workflow_dispatch)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. v1.0.0)"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write   # needed to create / upload GitHub Release assets

jobs:
  build-and-release:
    name: Build installer on Windows
    runs-on: windows-latest

    env:
      # Prevent PyQt6 from crashing on the headless runner
      QT_QPA_PLATFORM: offscreen

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout LightNovelCrawler runtime
        uses: actions/checkout@v4
        with:
          repository: lncrawl/lightnovel-crawler
          ref: v4.14.0
          path: lightnovel-crawler-dev
          persist-credentials: false

      - name: Resolve release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $releaseTag = $env:INPUT_VERSION
          } else {
            $releaseTag = $env:TAG_REF
          }
          $appVersion = $releaseTag.TrimStart("v")
          if ($appVersion -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $releaseTag"
          }
          Set-Content -Path VERSION -Value $appVersion -NoNewline -Encoding utf8
          "APP_VERSION=$appVersion" >> $env:GITHUB_ENV
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install application dependencies ────────────────────────────────
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-lncrawl.txt

      # Keep Chromium outside the PyInstaller tree. The headless shell is enough
      # for the app's Chromium launch(headless=True) scraping paths.
      - name: Build optional Playwright browser pack
        id: browser-pack
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\novelbridge-playwright-browsers
        shell: pwsh
        run: |
          python -m playwright install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browserRoot = $env:PLAYWRIGHT_BROWSERS_PATH
          if (!(Test-Path -LiteralPath $browserRoot)) {
            throw "Playwright did not create the browser cache at $browserRoot"
          }
          New-Item -ItemType Directory -Path "installer\Output" -Force | Out-Null
          $browserPack = "installer\Output\NovelBridgeAR_BrowserPack_$env:APP_VERSION.zip"
          Compress-Archive -Path (Join-Path $browserRoot "*") `
            -DestinationPath $browserPack -CompressionLevel Optimal
          "path=$browserPack" >> $env:GITHUB_OUTPUT
          $packSize = (Get-Item -LiteralPath $browserPack).Length / 1MB
          Write-Host ("Optional Chromium headless-shell pack: {0:F1} MB" -f $packSize)

      # ── 5. Confirm what is installed ───────────────────────────────────────
      - name: Show installed packages
        run: pip list

      # ── 6. Build with PyInstaller ──────────────────────────────────────────
      - name: Build executable (PyInstaller)
        run: pyinstaller novel_bridge.spec --noconfirm --log-level INFO

      # ── 7. Verify the exe was produced ────────────────────────────────────
      - name: Verify dist output
        run: |
          if (!(Test-Path "dist\NovelBridgeAR\NovelBridgeAR.exe")) {
            Write-Error "NovelBridgeAR.exe was NOT found in dist\NovelBridgeAR\"
            Get-ChildItem dist -Recurse | Select-Object FullName
            exit 1
          }
          Write-Host "✅ NovelBridgeAR.exe found"
          Get-Item "dist\NovelBridgeAR\NovelBridgeAR.exe" | Select-Object Name, Length
          $dataRoots = @("dist\NovelBridgeAR\_internal", "dist\NovelBridgeAR")
          $dataRoot = $dataRoots |
            Where-Object {
              Test-Path -LiteralPath (Join-Path $_ "lightnovel-crawler-dev\lncrawl\__init__.py")
            } |
            Select-Object -First 1
          if (!$dataRoot) {
            throw "LightNovelCrawler runtime is missing from the application bundle"
          }
          $requiredCrawlerFiles = @(
            "lightnovel-crawler-dev\LICENSE",
            "other sources\lightnovel-crawler-sources\LICENSE",
            "other sources\lightnovel-crawler-sources\en",
            "other sources\lightnovel-crawler-sources\ar"
          ) | ForEach-Object { Join-Path $dataRoot $_ }
          foreach ($path in $requiredCrawlerFiles) {
            if (!(Test-Path -LiteralPath $path)) {
              throw "LightNovelCrawler payload is missing from the application bundle: $path"
            }
          }
          Write-Host "✅ LightNovelCrawler runtime, English/Arabic sources, and licenses found"
        shell: pwsh

      - name: Download previous portable release for delta build
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const currentVersion = (process.env.APP_VERSION || '').replace(/^v/, '');
            const previous = releases.data
              .filter(release => !release.draft && !release.prerelease)
              .filter(release => release.tag_name.replace(/^v/, '') !== currentVersion)
              .sort((left, right) => Date.parse(right.published_at) - Date.parse(left.published_at))
              .find(release => release.assets.some(asset => asset.name === 'NovelBridgeAR_Portable.zip'));
            if (!previous) {
              core.notice('No prior portable release found; this release will use the full installer until a baseline is available.');
              core.setOutput('found', 'false');
              return;
            }
            const asset = previous.assets.find(item => item.name === 'NovelBridgeAR_Portable.zip');
            const response = await fetch(asset.browser_download_url);
            if (!response.ok) throw new Error(`Could not download prior release package: ${response.status}`);
            const destination = path.join(process.env.RUNNER_TEMP, 'NovelBridgeAR_Previous.zip');
            fs.writeFileSync(destination, Buffer.from(await response.arrayBuffer()));
            core.setOutput('found', 'true');
            core.setOutput('path', destination);

      - name: Prepare portable archive and delta installer source
        shell: pwsh
        env:
          PREVIOUS_FOUND: ${{ steps.previous.outputs.found }}
          PREVIOUS_ARCHIVE: ${{ steps.previous.outputs.path }}
        run: |
          $arguments = @(
            "scripts/create_update_package.py",
            "--source", "dist/NovelBridgeAR",
            "--portable-output", "installer/Output/NovelBridgeAR_Portable.zip",
            "--update-build-dir", "installer/UpdateBuild"
          )
          if ($env:PREVIOUS_FOUND -eq "true") {
            $previousRoot = Join-Path $env:RUNNER_TEMP "NovelBridgeAR_Previous"
            Expand-Archive -LiteralPath $env:PREVIOUS_ARCHIVE -DestinationPath $previousRoot -Force
            $arguments += @("--previous-dir", (Join-Path $previousRoot "NovelBridgeAR"))
          }
          python @arguments

      # ── 8. Install Inno Setup ──────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      # ── 9. Compile installer ───────────────────────────────────────────────
      - name: Compile installer (Inno Setup)
        run: |
          Write-Host "Building installer for version: $env:APP_VERSION (tag: $env:RELEASE_TAG)"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:APP_VERSION" "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Compile incremental update installer
        shell: pwsh
        run: |
          $updateScript = "installer\UpdateBuild\update.iss"
          if (Test-Path $updateScript) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            & $iscc $updateScript
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "No incremental package was generated; users will receive the full installer fallback."
          }

      - name: Write installer checksums
        shell: pwsh
        run: |
          Get-ChildItem "installer\Output" -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") } |
            ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            $text = "$hash  $($_.Name)"
            [System.IO.File]::WriteAllText(
              "$($_.FullName).sha256",
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

      # ── 10. Verify installer was produced ──────────────────────────────────
      - name: Verify installer output
        run: |
          if (!(Test-Path "installer\Output\NovelBridgeAR_Setup.exe")) {
            Write-Error "NovelBridgeAR_Setup.exe was NOT found!"
            Get-ChildItem "installer\Output" -ErrorAction SilentlyContinue
            exit 1
          }
          $size = (Get-Item "installer\Output\NovelBridgeAR_Setup.exe").Length / 1MB
          $browserSize = (Get-Item "installer\Output\NovelBridgeAR_BrowserPack_$env:APP_VERSION.zip").Length / 1MB
          $bundleSize = (Get-ChildItem "dist\NovelBridgeAR" -Recurse -File |
            Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("✅ Installer found — {0:F1} MB" -f $size)
          Write-Host ("Application bundle: {0:F1} MB; optional browser pack: {1:F1} MB" -f $bundleSize, $browserSize)
          "### Windows release package sizes" >> $env:GITHUB_STEP_SUMMARY
          "| Asset | Size (MiB) |`n| --- | ---: |`n| Setup installer | {0:F1} |`n| PyInstaller application bundle | {1:F1} |`n| Optional Chromium browser pack | {2:F1} |" -f $size, $bundleSize, $browserSize >> $env:GITHUB_STEP_SUMMARY
          "Largest application bundle files:" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem "dist\NovelBridgeAR" -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object -First 10 |
            ForEach-Object {
              "| $($_.FullName.Substring((Resolve-Path 'dist\NovelBridgeAR').Path.Length + 1)) | $([math]::Round($_.Length / 1MB, 1)) MiB |" >> $env:GITHUB_STEP_SUMMARY
            }
        shell: pwsh

      # ── 11. Upload installer as workflow artifact (always, for debugging) ───
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NovelBridgeAR-installer
          path: installer/Output/*
          retention-days: 7

      # ── 12. Create/update GitHub Release and attach installer ───────────────
      - name: Collect release assets
        id: release-assets
        shell: pwsh
        run: |
          $files = @(
            "installer/Output/NovelBridgeAR_Setup.exe",
            "installer/Output/NovelBridgeAR_Setup.exe.sha256",
            "installer/Output/NovelBridgeAR_Portable.zip",
            "installer/Output/NovelBridgeAR_Portable.zip.sha256",
            "installer/Output/NovelBridgeAR_BrowserPack_${env:APP_VERSION}.zip",
            "installer/Output/NovelBridgeAR_BrowserPack_${env:APP_VERSION}.zip.sha256"
          )
          $files += Get-ChildItem "installer/Output" -Filter "NovelBridgeAR_Update_*.exe" |
            ForEach-Object { $_.FullName.Replace("$PWD\", "").Replace("\", "/") }
          $files += Get-ChildItem "installer/Output" -Filter "NovelBridgeAR_Update_*.exe.sha256" |
            ForEach-Object { $_.FullName.Replace("$PWD\", "").Replace("\", "/") }
          "files<<EOF" >> $env:GITHUB_OUTPUT
          $files | ForEach-Object { $_ >> $env:GITHUB_OUTPUT }
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NovelBridge AR ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: ${{ steps.release-assets.outputs.files }}
          body: |
            ## NovelBridge AR ${{ env.RELEASE_TAG }}

            ### 📥 Installation
            1. Download **NovelBridgeAR_Setup.exe** below
            2. Run the installer and follow the wizard
            3. Launch **NovelBridge AR** from the Start Menu or Desktop shortcut

            Browser-based scraping is optional. To enable it, download **NovelBridgeAR_BrowserPack_${{ env.APP_VERSION }}.zip**, verify its SHA-256 checksum, and extract its contents into `%LOCALAPPDATA%\ms-playwright`. Install the browser pack from the matching release again after updating the app. Ordinary HTTP-based scraping and the GUI do not require this pack.

            Existing installations receive a smaller incremental update when one is available. The full installer remains available as a fallback.

            ### 📋 What's new
            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ env.RELEASE_TAG }}) for changes in this release.
